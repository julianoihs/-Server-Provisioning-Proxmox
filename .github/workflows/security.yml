name: Security checks

on:
  push:
    branches: [dev-lab]
  pull_request:
    branches: [dev-lab]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prevent-sensitive-files:
    name: Prevent sensitive files in Git
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository without retaining credentials
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked secret and state files
        shell: bash
        run: |
          set -euo pipefail
          forbidden_files="$(git ls-files | grep -E '(^|/)(\.env(\..*)?|.*\.(pem|key|p12|pfx|tfstate)(\..*)?|id_(rsa|ecdsa|ed25519))$' || true)"
          if [ -n "$forbidden_files" ]; then
            echo 'Sensitive or state files must not be tracked:' >&2
            echo "$forbidden_files" >&2
            exit 1
          fi

      - name: Reject private key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'; then
            echo 'Private key material must not be committed.' >&2
            exit 1
          fi

      - name: Reject common token formats
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{20,})'; then
            echo 'A likely GitHub or GitLab token was found.' >&2
            exit 1
          fi
